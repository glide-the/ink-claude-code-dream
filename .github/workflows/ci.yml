# [Input] Canonical original source inventory, locked tooling and provider-free static contracts.
# [Output] Verify one source layout and regression tests without fetching restricted recovered dependencies.
# [Pos] Pull-request/main CI; full source compilation requires separately supplied dependency/assets roots.
# [Sync] 2026-09-13: remove retired cleanroom builds and the incorrect ban on checked original source.

name: Runtime CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: runtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm test
      - run: npm run test:mcp-auth-compat
      - name: Verify original implementation and reference are identical
        run: npm run restored-source:verify
