# [Input] Main-branch clean-room source plus checked Dream business, target-host, redistribution, and publication gates.
# [Output] One exact verified five-tarball clean-room release set bound to the dispatched commit.
# [Pos] Manual predecessor of publish-npm.yml; it never reads restored source and never publishes.
# [Sync] 2026-08-24: replace restored-core/native-runner qualification with the clean-room cross-target release set.

name: Qualify clean-room npm Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.20
      - name: Require main and every checked external qualification gate
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = main
          node --input-type=module <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const artifact = JSON.parse(readFileSync("runtime/cleanroom-artifact-policy.json", "utf8"));
          const npmPolicy = JSON.parse(readFileSync("runtime/cleanroom-npm-policy.json", "utf8"));
          const gate = artifact.publicationGate;
          const hosts = Object.values(gate.targetHostQualification ?? {});
          const receiptBody = readFileSync(gate.businessAcceptance?.receiptPath);
          const receiptSha256 = createHash("sha256").update(receiptBody).digest("hex");
          if (
            gate.productionEligible !== true ||
            gate.publicationAllowed !== true ||
            gate.redistributionAllowed !== true ||
            gate.businessAcceptance?.passed !== true ||
            gate.businessAcceptance?.receiptSha256 !== receiptSha256 ||
            hosts.length !== 4 || hosts.some(value => value !== true) ||
            npmPolicy.publication?.npmPublishAllowed !== true
          ) throw new Error("checked Dream business, four-host, redistribution, or npm publication gate is closed");
          EOF
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm test
      - name: Build and verify exact five-package release set
        run: |
          npm run cleanroom:build:targets
          npm run cleanroom:npm:package
          npm run cleanroom:npm:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cleanroom-npm-${{ github.sha }}
          path: dist/cleanroom-npm/tarballs
          if-no-files-found: error
          retention-days: 1
