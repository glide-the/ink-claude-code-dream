# [Input] Current original-source layout and source-derived artifact/legal gates.
# [Output] Explicitly reject reuse of the retired cleanroom native qualification workflow.
# [Pos] Manual fail-closed placeholder; no artifacts, provider calls or publication occur.
# [Sync] 2026-09-13: original-module implementation requires fresh authorized four-target qualification.

name: Qualify npm Runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-authority-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refuse retired implementation qualification
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const layout = JSON.parse(readFileSync("runtime/source-layout.json", "utf8"));
          const policy = JSON.parse(readFileSync("runtime/local-artifact-policy.json", "utf8"));
          console.error(JSON.stringify({
            blocked: true,
            implementationRoot: layout.implementationRoot,
            parallelImplementation: layout.parallelImplementation,
            publicationAllowed: policy.legalGate.publicationAllowed,
            reason: "Original modules require fresh source-derived license and four-target qualification; old cleanroom receipts cannot be reused."
          }));
          process.exit(1);
          NODE
