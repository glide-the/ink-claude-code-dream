# [Input] One target-native authorized source tree plus explicit official CLI, SDK Python, Dream backend, and OAuth fixture paths on a controlled runner.
# [Output] One digest-bound, production-qualified local core package for the exact commit and native target.
# [Pos] Required predecessor of publish-npm.yml; no publication occurs here and all external Actions are immutable-SHA pinned.

name: Qualify npm Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-platform:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
          - target: darwin-x64
          - target: linux-arm64
          - target: linux-x64
    runs-on: [self-hosted, ink-runtime-qualification, ${{ matrix.target }}]
    env:
      INK_CLAUDE_CODE_SOURCE_ROOT: ${{ vars.INK_CLAUDE_CODE_SOURCE_ROOT }}
      INK_TEST_REFERENCE_CLI: ${{ vars.INK_TEST_REFERENCE_CLI }}
      INK_SDK_PYTHON: ${{ vars.INK_SDK_PYTHON }}
      INK_DREAM_BACKEND: ${{ vars.INK_DREAM_BACKEND }}
      INK_MCP_OAUTH_FIXTURE_PYTHON: ${{ vars.INK_MCP_OAUTH_FIXTURE_PYTHON }}
      INK_MCP_OAUTH_FIXTURE_ROOT: ${{ vars.INK_MCP_OAUTH_FIXTURE_ROOT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Require checked redistribution/publication authorization
        run: npm run npm:legal
      - name: Validate explicit qualification inputs
        shell: bash
        run: |
          for variable in \
            INK_CLAUDE_CODE_SOURCE_ROOT \
            INK_TEST_REFERENCE_CLI \
            INK_SDK_PYTHON \
            INK_DREAM_BACKEND \
            INK_MCP_OAUTH_FIXTURE_PYTHON \
            INK_MCP_OAUTH_FIXTURE_ROOT; do
            value="${!variable:-}"
            test -n "$value"
            case "$value" in /*) ;; *) echo "$variable must be absolute" >&2; exit 78;; esac
            test -e "$value"
          done
      - name: Build target-native minimal core and launcher
        env:
          INK_CLAUDE_CODE_BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          bun run build:core-local
          node scripts/verify-core-prune.mjs
          mkdir -p dist/core-local/bin dist/core-local/qualification
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'exec "'"$PWD"'/node_modules/.bin/bun" "'"$PWD"'/dist/core-local/bundle/cli.js" "$@"' > dist/core-local/bin/ink-claude-code-dream
          chmod 0755 dist/core-local/bin/ink-claude-code-dream
      - name: Run official/candidate SDK and MCP differential contracts
        env:
          INK_TEST_CANDIDATE_CLI: ${{ github.workspace }}/dist/core-local/bin/ink-claude-code-dream
          INK_CORE_BUILD_RECEIPT: ${{ github.workspace }}/dist/core-local/build-receipt.json
          INK_CORE_BUNDLE_PATH: ${{ github.workspace }}/dist/core-local/bundle/cli.js
          INK_CORE_SDK_RECEIPT: ${{ github.workspace }}/dist/core-local/qualification/sdk-differential.json
          INK_CORE_MCP_RECEIPT: ${{ github.workspace }}/dist/core-local/qualification/mcp-differential.json
        run: |
          node scripts/run-core-sdk-differential.mjs
          node scripts/run-core-mcp-differential.mjs
      - name: Run Dream production MCP management process contract
        run: >-
          "$INK_SDK_PYTHON" scripts/run-core-mcp-management-contract.py
          --cli "$GITHUB_WORKSPACE/dist/core-local/bin/ink-claude-code-dream"
          --output "$GITHUB_WORKSPACE/dist/core-local/qualification/mcp-management.json"
          --dream-backend "$INK_DREAM_BACKEND"
          --mode candidate
          --bun "$GITHUB_WORKSPACE/node_modules/.bin/bun"
          --core-receipt "$GITHUB_WORKSPACE/dist/core-local/build-receipt.json"
          --core-bundle "$GITHUB_WORKSPACE/dist/core-local/bundle/cli.js"
      - name: Aggregate qualification and package exact native artifact
        env:
          INK_CORE_BUILD_RECEIPT: ${{ github.workspace }}/dist/core-local/build-receipt.json
          INK_CORE_BUNDLE_PATH: ${{ github.workspace }}/dist/core-local/bundle/cli.js
          INK_CORE_SDK_RECEIPT: ${{ github.workspace }}/dist/core-local/qualification/sdk-differential.json
          INK_CORE_MCP_RECEIPT: ${{ github.workspace }}/dist/core-local/qualification/mcp-differential.json
          INK_CORE_MCP_MANAGEMENT_RECEIPT: ${{ github.workspace }}/dist/core-local/qualification/mcp-management.json
          INK_CORE_FULL_RECEIPT: ${{ github.workspace }}/dist/core-local/qualification/full-runtime-qualification.json
          INK_REQUIRE_CORE_OAUTH_FIXTURE: "1"
        shell: bash
        run: |
          node scripts/qualify-core-local.mjs
          node scripts/package-core-local.mjs \
            --sdk-receipt "$INK_CORE_SDK_RECEIPT" \
            --mcp-receipt "$INK_CORE_MCP_RECEIPT" \
            --full-receipt "$INK_CORE_FULL_RECEIPT"
          artifact_name=$(node -p "require('./runtime/local-artifact-policy.json').artifact.name")
          artifact_version=$(node -p "require('./runtime/local-artifact-policy.json').artifact.version")
          node scripts/verify-core-package-local.mjs "dist/core-package-local/$artifact_name-$artifact_version"
      - name: Upload exact commit/target qualification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-core-${{ matrix.target }}
          path: dist/core-package-local
          if-no-files-found: error
          retention-days: 1
