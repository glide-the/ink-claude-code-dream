# [Input] Current original-source implementation and explicit source-derived publication gate.
# [Output] Fail closed without downloading old artifacts, accessing tokens or publishing packages.
# [Pos] Existing workflow name retained; retired cleanroom publication lane is disabled.
# [Sync] 2026-09-13: original-module Runtime cannot inherit the previous implementation's MIT release authority.

name: Publish npm Runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Original-source publication is not authorized
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const layout = JSON.parse(readFileSync("runtime/source-layout.json", "utf8"));
          const policy = JSON.parse(readFileSync("runtime/npm-release-policy.json", "utf8"));
          console.error(JSON.stringify({
            blocked: true,
            version: layout.version,
            implementationRoot: layout.implementationRoot,
            publicationAllowed: layout.publicationAllowed,
            license: policy.publish.license,
            reason: "No source-derived redistribution/publication grant or same-byte native qualification."
          }));
          process.exit(1);
          NODE
